name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-test:
        name: build & test (${{ matrix.db }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                db: [mysql, postgres]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            # The runner's bundled npm 10 can crash with "Exit handler never
            # called!", leaving an incomplete install; a current npm avoids it.
            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # The optional CLI `create` end-to-end test shells out to a db
            # client to CREATE DATABASE on the container; it self-skips when
            # the client is absent. Install it so that path is exercised too.
            - name: Install database client
              run: |
                  sudo apt-get update
                  if [ "${{ matrix.db }}" = "mysql" ]; then
                      sudo apt-get install -y default-mysql-client
                  else
                      sudo apt-get install -y postgresql-client
                  fi

            # The create-parity test spawns cli/cli.js, which needs the CLI's
            # own dependencies (it has a separate package.json / node_modules).
            - name: Install CLI dependencies
              run: npm ci
              working-directory: cli

            # cli.js create makes an initial git commit; the runner has no git
            # identity by default, which would fail that commit (exit 128).
            - name: Configure git identity
              run: |
                  git config --global user.email "ci@appx-core.test"
                  git config --global user.name "appx-core CI"

            # testcontainers uses the Docker daemon preinstalled on the runner.
            - name: Test
              run: npm test
              env:
                  DB_PROVIDER: ${{ matrix.db }}

    cli-smoke:
        name: cli smoke
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: cli/package-lock.json

            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install CLI dependencies
              run: npm ci
              working-directory: cli

            - name: Smoke test
              run: node cli.js --help
              working-directory: cli
