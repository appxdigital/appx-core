name: Release

# Publishing is driven ONLY by pushing a git tag, never by a branch push.
# The tag's shape decides the npm dist-tag:
#   v1.2.3-alpha.0  -> dist-tag `alpha`   (published, not gated)
#   v1.2.3-beta.0   -> dist-tag `beta`    (published, not gated)
#   v1.2.3-rc.0     -> dist-tag `next`    (published, not gated)
#   v1.2.3          -> dist-tag `latest`  (production; PAUSES for approval)
#
# The `production` job targets a GitHub Environment with a required reviewer,
# so a clean tag builds and tests, then waits for a human click in the Actions
# UI before it ever reaches `latest`. See RELEASING.md.
#
# Auth to npm is via OIDC trusted publishing — no NPM_TOKEN secret is stored.
# Requires a one-time Trusted Publisher config on npmjs.com (see RELEASING.md).
#
# npm is upgraded before every `npm ci`: the runner's bundled npm 10 can crash
# with "Exit handler never called!", leaving an incomplete install so the build
# silently falls back to the runner's globally preinstalled (newer) tsc. A
# current npm avoids that and keeps the pinned toolchain authoritative.

on:
    push:
        tags: ['v*']

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify:
        name: verify (tag, channel)
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.channel.outputs.version }}
            channel: ${{ steps.channel.outputs.channel }}
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Assert tag matches package.json version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG="$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$PKG" ]; then
                      echo "::error::Tag ${GITHUB_REF_NAME} (=${TAG}) does not match package.json version ${PKG}."
                      echo "Set package.json to the release version before tagging (see RELEASING.md)."
                      exit 1
                  fi
                  echo "Version OK: ${PKG}"

            - name: Determine dist-tag (channel)
              id: channel
              run: |
                  V="${GITHUB_REF_NAME#v}"
                  if echo "$V" | grep -q -- '-alpha'; then
                      CH=alpha
                  elif echo "$V" | grep -q -- '-beta'; then
                      CH=beta
                  elif echo "$V" | grep -q -- '-'; then
                      # Any other prerelease (e.g. -rc): publish off `latest`.
                      CH=next
                  else
                      CH=latest
                  fi
                  echo "version=$V" >> "$GITHUB_OUTPUT"
                  echo "channel=$CH" >> "$GITHUB_OUTPUT"
                  echo "Publishing ${V} to dist-tag '${CH}'."

    # Build + full suite against BOTH database providers before any publish —
    # mirrors the CI matrix, so a provider-specific regression can never reach a
    # dist-tag (including `latest`). Publishing depends on every leg passing.
    test:
        name: build & test (${{ matrix.db }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                db: [mysql, postgres]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # The optional CLI `create` end-to-end test shells out to a db client
            # to CREATE DATABASE on the container; install it so that path runs.
            - name: Install database client
              run: |
                  sudo apt-get update
                  if [ "${{ matrix.db }}" = "mysql" ]; then
                      sudo apt-get install -y default-mysql-client
                  else
                      sudo apt-get install -y postgresql-client
                  fi

            # The create-parity test spawns cli/cli.js, which needs the CLI's
            # own dependencies (separate package.json / node_modules).
            - name: Install CLI dependencies
              run: npm ci
              working-directory: cli

            # cli.js create makes an initial git commit; the runner has no git
            # identity by default, which would fail that commit (exit 128).
            - name: Configure git identity
              run: |
                  git config --global user.email "ci@appx-core.test"
                  git config --global user.name "appx-core CI"

            - name: Test (${{ matrix.db }})
              run: npm test
              env:
                  DB_PROVIDER: ${{ matrix.db }}

    publish-prerelease:
        name: publish ${{ needs.verify.outputs.channel }}
        needs: [verify, test]
        if: needs.verify.outputs.channel != 'latest'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # OIDC token for npm trusted publishing
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  registry-url: 'https://registry.npmjs.org'

            # Also gives OIDC trusted publishing the recent npm it requires.
            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish (${{ needs.verify.outputs.channel }})
              run: npm publish --tag "${{ needs.verify.outputs.channel }}" --provenance --access public

    publish-production:
        name: publish latest (gated)
        needs: [verify, test]
        if: needs.verify.outputs.channel == 'latest'
        runs-on: ubuntu-latest
        environment: production # required-reviewer gate; approve in the Actions UI
        permissions:
            contents: read
            id-token: write # OIDC token for npm trusted publishing
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
                  registry-url: 'https://registry.npmjs.org'

            # Also gives OIDC trusted publishing the recent npm it requires.
            - name: Upgrade npm
              run: npm install -g npm@11

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Publish (latest)
              run: npm publish --tag latest --provenance --access public
